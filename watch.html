<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Welcome from Ellington &amp; Vale</title>
<style>
  :root{
    --off-black:#0a0a0a;
    --off-white:#ffffff;
    --mid-grey:#8a8a8a;
    --max-width:1440px;
    --side-margin:8vw;
    --ease-reveal:cubic-bezier(0.16,1,0.3,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  body{
    background:var(--off-white);
    color:var(--off-black);
    font-family:'Playfair Display',Georgia,'Times New Roman',serif;
    font-size:15px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:underline;text-underline-offset:.2em;}
  img,video{max-width:100%;display:block;border-radius:0;box-shadow:none;}

  .container{max-width:var(--max-width);margin:0 auto;padding-left:var(--side-margin);padding-right:var(--side-margin);}
  .uppercase{text-transform:uppercase;letter-spacing:.15em;}

  header{padding:4vh var(--side-margin) 0;}
  .wordmark{
    font-size:13px;
    letter-spacing:.3em;
    text-decoration:none;
    text-transform:uppercase;
  }

  .titleBlock{
    max-width:var(--max-width);
    margin:0 auto;
    padding:8vh var(--side-margin) 6vh;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:var(--mid-grey);
    margin:0 0 1.2em;
  }
  h1{
    font-size:clamp(44px,7vw,96px);
    line-height:1.05;
    font-weight:400;
    margin:0;
  }

  .stage{width:100%;}
  video{width:100%;height:auto;background:#000;}

  .below{
    max-width:640px;
    margin:0 auto;
    padding:10vh var(--side-margin) 4vh;
    text-align:center;
  }
  .below p{
    font-size:17px;
    line-height:1.9;
    margin:0;
  }
  .cta{
    display:inline-block;
    margin-top:2.6em;
    font-size:12px;
    letter-spacing:.15em;
    text-transform:uppercase;
  }

  footer{
    padding:10vh var(--side-margin) 6vh;
    text-align:center;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--mid-grey);
  }
</style>
</head>
<body>

<header>
  <a class="wordmark" href="https://ellingtonandvale.com/">Ellington &amp; Vale</a>
</header>

<div class="titleBlock">
  <p class="eyebrow">A film &nbsp;·&nbsp; 0:08 &nbsp;·&nbsp; From the studio</p>
  <h1>A welcome.</h1>
</div>

<div class="stage">
  <video
    controls
    playsinline
    preload="metadata"
    poster="https://gauravmarketmaverick-cyber.github.io/ellington-vale-email/assets/image-13-welcome-video.jpg">
    <source src="https://gauravmarketmaverick-cyber.github.io/ellington-vale-email/assets/IMG_4090.MP4" type="video/mp4">
    Your browser doesn't support embedded video.
    <a href="https://gauravmarketmaverick-cyber.github.io/ellington-vale-email/assets/IMG_4090.MP4">Download the video</a> instead.
  </video>
</div>

<div class="below">
  <p>
    Thank you for taking a moment with us. If anything here resonates,
    write back — one line is enough to start a conversation.
  </p>
  <a class="cta" href="https://ellingtonandvale.com/">Visit the studio</a>
</div>

<footer>
  &copy; 2026 Ellington &amp; Vale
</footer>

</body>
</html>
