   ELLINGTON & VALE — THE OBSERVATION  ·  FINAL COMBINED CUT

   ┌────────────────────────────────────────────────────────────────────┐
   │  ALL DIAGNOSTIC COPY IS SAMPLE TEXT — marked ► SAMPLE.               │
   │  Replace with your own reading before this is sent.                  │
   └────────────────────────────────────────────────────────────────────┘

   WHAT THIS VERSION IS
   Everything built across the last several drafts, cut down to the pieces
   that argue the real point: this was never about one small photograph.
   It is about the whole page — what her own words already say (strong),
   what the About section currently says (generic), and the fact that
   three different tones share one screen. The photo appears once, folded
   into that larger reading, not as its own repeated subject.

   SEQUENCE
   Masthead → docket → the record (her words, flattering) → the stranger's
   view (search result) → the real gap (headline vs About) → the register
   (three voices) → the whole page, swapped at once → the direction (proof
   of work — four portraits, one honest exclusion) → the realisation,
   stated plainly → the question → close.

   TOKENS
   Paper #FFFFFF   Ink #1C1815   Gold #A8834E   Stone #6E6559   Rule #E8E4DB
   ========================================================================== */
